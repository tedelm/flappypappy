<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#87CEEB">
  <meta name="description" content="Fly a pint through keg stacks">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flappy Pappy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Flappy Pappy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 1.2rem;
      text-align: center;
    }
    canvas { display: block; touch-action: none; visibility: hidden; }
    #nameInput {
      display: none;
      position: fixed;
      z-index: 10;
      margin: 0;
      padding: 0 8px;
      border: 2px solid rgb(140, 140, 150);
      border-radius: 0;
      background: rgb(200, 200, 210);
      color: rgb(245, 245, 240);
      font-family: system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      outline: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <p id="loading">Pouring beer...</p>
  <input id="nameInput" type="text" maxlength="8" autocomplete="off"
         autocapitalize="characters" enterkeyhint="done" inputmode="text"
         spellcheck="false" aria-label="Player name" />
  <script>
    const GAME_W = 400;
    const GAME_H = 600;

    let nameInputVisible = false;
    let nameInputBounds = { x: 0, y: 0, w: 0, h: 0 };
    let gameReady = false;

    function getCanvas() {
      return document.querySelector("canvas");
    }

    function sanitizeName(value, maxLen) {
      let out = "";
      const upper = String(value).toUpperCase();
      for (let i = 0; i < upper.length; i++) {
        const ch = upper[i];
        if ((ch >= "A" && ch <= "Z") || (ch >= "0" && ch <= "9")) {
          out += ch;
          if (out.length >= maxLen) break;
        }
      }
      return out;
    }

    function positionNameInput(x, y, w, h) {
      const canvas = getCanvas();
      const input = document.getElementById("nameInput");
      if (!canvas || !input) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width / GAME_W;
      const scaleY = rect.height / GAME_H;
      input.style.left = (rect.left + x * scaleX) + "px";
      input.style.top = (rect.top + y * scaleY) + "px";
      input.style.width = (w * scaleX) + "px";
      input.style.height = (h * scaleY) + "px";
      nameInputBounds = { x, y, w, h };
    }

    function focusCanvas() {
      const canvas = getCanvas();
      if (!canvas) return;
      try {
        canvas.focus({ preventScroll: true });
      } catch (_) {
        canvas.focus();
      }
    }

    function focusNameInput() {
      const input = document.getElementById("nameInput");
      if (!input) return;
      try {
        input.focus({ preventScroll: true });
      } catch (_) {
        input.focus();
      }
    }

    window.flappyShowNameInput = function(x, y, w, h, value, maxLen) {
      requestAnimationFrame(() => {
        const input = document.getElementById("nameInput");
        if (!input) return;
        input.maxLength = maxLen;
        input.dataset.maxLen = String(maxLen);
        input.value = sanitizeName(value, maxLen);
        positionNameInput(x, y, w, h);
        input.style.display = "block";
        nameInputVisible = true;
      });
    };

    window.flappyHideNameInput = function() {
      requestAnimationFrame(() => {
        const input = document.getElementById("nameInput");
        if (!input) return;
        input.blur();
        input.style.display = "none";
        nameInputVisible = false;
        focusCanvas();
      });
    };

    window.flappySyncNameInput = function() {
      if (!nameInputVisible) return "";
      const input = document.getElementById("nameInput");
      if (!input) return "";
      const maxLen = parseInt(input.dataset.maxLen || "8", 10);
      const v = sanitizeName(input.value, maxLen);
      if (input.value !== v) input.value = v;
      return v;
    };

    window.flappyFocusNameInput = function() {
      requestAnimationFrame(() => {
        const input = document.getElementById("nameInput");
        if (!input) return;
        positionNameInput(
          nameInputBounds.x,
          nameInputBounds.y,
          nameInputBounds.w,
          nameInputBounds.h
        );
        focusNameInput();
      });
    };

    window.flappyHideLoading = function() {
      gameReady = true;
      requestAnimationFrame(() => {
        const loading = document.getElementById("loading");
        if (loading) loading.style.display = "none";
        const canvas = getCanvas();
        if (canvas) canvas.style.visibility = "visible";
      });
    };

    window.flappySetLoadingText = function(text) {
      document.getElementById("loading").textContent = text;
    };

    function keepCanvasHidden() {
      if (gameReady) return;
      const canvas = getCanvas();
      if (canvas) canvas.style.visibility = "hidden";
    }

    const canvasObserver = new MutationObserver(keepCanvasHidden);
    canvasObserver.observe(document.body, { childList: true, subtree: true });
    keepCanvasHidden();

    document.getElementById("nameInput").addEventListener("input", function(e) {
      const maxLen = parseInt(e.target.dataset.maxLen || "8", 10);
      const v = sanitizeName(e.target.value, maxLen);
      if (e.target.value !== v) e.target.value = v;
    });

    function repositionNameInputIfVisible() {
      if (!nameInputVisible) return;
      positionNameInput(
        nameInputBounds.x,
        nameInputBounds.y,
        nameInputBounds.w,
        nameInputBounds.h
      );
    }

    window.addEventListener("resize", repositionNameInputIfVisible);
    window.addEventListener("orientationchange", repositionNameInputIfVisible);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", repositionNameInputIfVisible);
    }
  </script>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();

    async function startGame() {
      try {
        const resp = await fetch("./flappy.wasm");
        if (!resp.ok) {
          throw new Error("HTTP " + resp.status);
        }
        const bytes = await resp.arrayBuffer();
        const result = await WebAssembly.instantiate(bytes, go.importObject);
        const run = go.run(result.instance);
        if (run && typeof run.then === "function") {
          await run;
        }
      } catch (err) {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.style.display = "flex";
          loading.textContent = "Game crashed: " + err;
        }
        throw err;
      }
    }

    startGame().catch((err) => {
      const loading = document.getElementById("loading");
      if (loading && loading.style.display !== "none") {
        loading.style.display = "flex";
        loading.textContent = "Failed to load game: " + err;
      }
    });

    if ("serviceWorker" in navigator) {
      async function initServiceWorker() {
        const hadController = !!navigator.serviceWorker.controller;
        const reg = await navigator.serviceWorker.register("./sw.js", {
          updateViaCache: "none",
        });

        const checkForUpdates = () => reg.update().catch(() => {});
        checkForUpdates();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            checkForUpdates();
          }
        });
        setInterval(checkForUpdates, 60 * 60 * 1000);

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController) return;
          window.location.reload();
        });
      }

      window.addEventListener("load", () => {
        initServiceWorker().catch(() => {});
      });
    }
  </script>
</body>
</html>
