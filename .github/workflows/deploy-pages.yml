name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write redirect site
        env:
          FLAPPY_PUBLIC_URL: ${{ secrets.FLAPPY_PUBLIC_URL }}
        run: |
          mkdir -p site
          TARGET="${FLAPPY_PUBLIC_URL:-https://flappy-pappy.se}"
          TARGET="${TARGET%/}/"
          export TARGET
          python3 -c 'import json,os; t=os.environ["TARGET"]; e=json.dumps(t); open("site/index.html","w",encoding="utf-8").write("<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"refresh\" content=\"0;url=%s\">\n<link rel=\"canonical\" href=%s>\n<title>Flappy Pappy</title>\n<script>location.replace(%s);</script>\n</head>\n<body>\n<p>Moved to <a href=%s>%s</a>.</p>\n</body>\n</html>\n" % (t,e,e,e,t)); print("redirect ->", t)'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
