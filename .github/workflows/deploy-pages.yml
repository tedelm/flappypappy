name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: src/go.sum

      - name: Write SQLite Cloud config
        env:
          FLAPPY_SQLITECLOUD_URL: ${{ secrets.FLAPPY_SQLITECLOUD_URL }}
        run: |
          if [ -n "$FLAPPY_SQLITECLOUD_URL" ]; then
            printf 'window.FLAPPY_SQLITECLOUD_URL = %s;\n' \
              "$(python3 -c 'import json, os; print(json.dumps(os.environ["FLAPPY_SQLITECLOUD_URL"]))')" \
              > web/config.js
          else
            echo 'window.FLAPPY_SQLITECLOUD_URL = "";' > web/config.js
          fi

      - name: Build web bundle
        run: bash scripts/build-web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
